<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CERA EXPRESS LLC Payroll</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#172536;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#090909;color:white;padding:14px max(18px,calc((100% - 1120px)/2));border-bottom:3px solid #df171c}header strong{font-size:22px;letter-spacing:.5px}.brand-logo{display:block;width:min(420px,100%);height:auto;max-height:135px;object-fit:contain;object-position:left center}.brand-subtitle{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#d5d5d5;margin-top:4px}main{max-width:1120px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 10px #16283b08}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:0 0 12px}p{color:#546779}label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}input{padding:11px;border:1px solid #b9c7d4;border-radius:8px;font-size:16px;max-width:100%;width:100%}button,.btn{display:inline-block;border:0;background:#c91620;color:white;padding:11px 15px;border-radius:8px;font-size:15px;cursor:pointer;text-decoration:none}button.secondary,.btn.secondary{background:#e5edf4;color:#173b55}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>*{min-width:160px;flex:1}.row button,.row .btn{flex:0 0 auto}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5ebf0;padding:10px 7px;white-space:nowrap}th{background:#f1f5f8}td input{width:125px;min-width:110px}td a{color:#b9111b}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#f5eeee;border-radius:10px;padding:16px}.stat b{display:block;font-size:24px;margin-top:5px;overflow-wrap:anywhere}.notice{background:#fff3d6;border:1px solid #e8c477;padding:12px;border-radius:8px;margin:12px 0}.small{font-size:13px;color:#627487}.muted{color:#b5c6d5} @media(max-width:600px){.stats{grid-template-columns:1fr}.stat b{font-size:22px}header{padding:17px}h1{font-size:22px}}
</style></head><body><header><img class="brand-logo" src="{{ url_for('static',filename='cera-express-logo.png') }}" alt="CERA EXPRESS"><div class="brand-subtitle">LLC · Weekly Driver Payroll</div></header><main>{% for msg in get_flashed_messages() %}<div class="notice">{{msg}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
